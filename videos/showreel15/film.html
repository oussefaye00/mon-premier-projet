<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Showreel 15 s</title>
<style>
  @font-face { font-family: "Geist"; src: url("fonts/geist-latin.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #111; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  canvas { display: block; width: 1080px; height: 1920px; }
  body.preview canvas { height: 92vh; width: auto; }
  #hud { position: fixed; left: 12px; bottom: 12px; font: 13px/1.4 monospace; color: #ddd; background: #000a; padding: 6px 10px; border-radius: 6px; }
  body:not(.preview) #hud { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="hud"></div>
<script>
// Deterministic film: every pixel is a pure function of t (seconds). No timers, no state between frames.
const W = 1080, H = 1920, CX = W / 2, CY = H / 2, T = 15;
const BG = "#f5f5f2", INK = "#0b0b0c", ACC = "#ff6a2a", MUTE = "#8a8a85", TRACK = "#e2e2dc";
const ctx = document.getElementById("c").getContext("2d");
const F = (w, s) => `${w} ${s}px Geist`;

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const io = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = x => 1 - Math.pow(1 - clamp(x), 3);
const inn = x => Math.pow(clamp(x), 3);
const expoIO = x => (x = clamp(x), x === 0 ? 0 : x === 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
// closed-form spring step response (mass 1), 0 before t0. damping ratio >= 0.72 everywhere.
function spring(t, t0, k = 170, d = 26) {
  const x = t - t0; if (x <= 0) return 0;
  const w = Math.sqrt(k), z = d / (2 * w);
  if (z >= 1) return 1 - Math.exp(-w * x) * (1 + w * x);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
const S_UI = [320, 30], S_BOX = [170, 26], S_TYPE = [120, 24];
const sp = (t, t0, s) => spring(t, t0, s[0], s[1]);
const mix = (a, b, k) => {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(k)))).join(",")})`;
};

// ---------- drawing ----------
function rrect(x, y, w, h, r, fill) {
  w = Math.max(0, w); h = Math.max(0, h); r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}
function dot(x, y, r, fill = ACC, sx = 1, sy = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy);
  ctx.beginPath(); ctx.arc(0, 0, Math.max(0, r), 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}
// masked text: letters rise out of / fall into a clip box, staggered. inK, outK in [0,1].
function maskWord(str, x, y, size, weight, color, tIn, tOut, t, opts = {}) {
  const stag = opts.stagger ?? 0.055, align = opts.align ?? "center", track = opts.track ?? 0;
  ctx.font = F(weight, size);
  const chars = [...str], widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + track * (chars.length - 1);
  let x0 = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
  const asc = size * 0.78, desc = size * 0.26;
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - asc - size * .08, W, asc + desc + size * .16); ctx.clip();
  ctx.fillStyle = color; ctx.textBaseline = "alphabetic";
  chars.forEach((c, i) => {
    const kin = sp(t, tIn + i * stag, S_UI);
    const kout = tOut == null ? 0 : inn(prog(t, tOut + i * stag * .6, tOut + i * stag * .6 + .32));
    const dy = (1 - kin) * size * 1.3 - kout * size * 1.3 * (opts.exitUp ? 1 : -1);
    const rot = (1 - kin) * 0.12;
    ctx.save(); ctx.translate(x0 + widths[i] / 2, y + dy); ctx.rotate(rot);
    ctx.fillText(c, -widths[i] / 2, 0); ctx.restore();
    x0 += widths[i] + track;
  });
  ctx.restore();
  return total;
}
function textWidth(str, size, weight) { ctx.font = F(weight, size); return ctx.measureText(str).width; }

// ---------- scene ----------
const UP = CY - 300;            // dot rest position above the word
const WORD_Y = CY + 70;         // baseline of the big words
const BAR_Y = CY + 120, BAR_X0 = 110, BAR_X1 = 970;
const CORNER = Math.hypot(CX, CY) * 1.05;
const GRID = 3, CELL = 210, GAP = 36;

window.seek = async (t) => {
  t = clamp(t, 0, T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  // micro camera drift: never a frozen frame
  const cam = 1 + 0.012 * Math.sin(t * 0.9) + 0.02 * io(prog(t, 12.6, 15));
  ctx.translate(CX, CY); ctx.scale(cam, cam); ctx.translate(-CX, -CY);

  // ===== 1. HOOK (0 - 2.5): dot falls, lands, rises; MOTION comes out of the floor =====
  if (t < 2.45) {
    const fall = sp(t, 0.08, [180, 22]);
    let y = lerp(-140, CY, fall);
    const land = Math.max(0, t - 0.42);
    const squash = t > 0.42 ? Math.exp(-land * 9) * Math.sin(land * 22) : 0;
    const lift = sp(t, 0.95, S_BOX);
    y = lerp(y, UP, lift);
    dot(CX, y, 62, ACC, 1 + 0.22 * squash, 1 - 0.22 * squash);
    maskWord("MOTION", CX, WORD_Y, 218, 800, INK, 1.2, null, t, { track: -6 });
  }

  // ===== 2. DESIGN (2.4 - 4.7): dot stretches into a bar that wipes MOTION into DESIGN =====
  if (t >= 2.45 && t < 4.75) {
    const s = sp(t, 2.45, S_UI);                         // dot -> thin bar
    const cover = io(prog(t, 2.95, 3.35));               // bar drops & thickens over the word
    const ret = expoIO(prog(t, 3.42, 3.95));             // left edge retracts to the right
    const back = sp(t, 3.95, S_UI);                      // remainder -> dot
    const word = t < 3.38 ? "MOTION" : "DESIGN";
    if (t < 3.38) maskWord("MOTION", CX, WORD_Y, 218, 800, INK, -9, null, t, { track: -6 });
    else maskWord("DESIGN", CX, WORD_Y, 218, 800, INK, -9, 4.35, t, { track: -6, stagger: 0.035 });
    let w = lerp(124, 900, s), h = lerp(124, 26, s);
    let cy = lerp(UP, WORD_Y - 80, cover); h = lerp(h, 270, cover);
    let x = CX - w / 2, xr = CX + w / 2;
    x = lerp(x, xr - 124, ret); w = xr - x;
    h = lerp(h, 124, ret);
    let bx = x, bw = w;
    if (back > 0) { const ex = lerp(xr - 62, CX + 330, back); cy = lerp(cy, UP, back); bx = ex - h / 2; bw = h; xr = ex + 62; }
    if (t < 4.35) rrect(bx, cy - h / 2, bw, h, h / 2, ACC);
    else {
      // dot travels to the centre, ready for the flood
      const go = sp(t, 4.35, S_BOX);
      dot(lerp(xr - 62, CX, go), lerp(cy, CY, go), 62);
    }
  }

  // ===== 3. FLOOD (4.75 - 7.5): circle clears the corners, "100 % code" =====
  if (t >= 4.75 && t < 7.5) {
    const g = expoIO(prog(t, 4.9, 5.25));
    const shrink = io(prog(t, 6.95, 7.45));             // flood contracts into a square
    let size = lerp(124, CORNER * 2, g);
    const target = CELL;
    size = lerp(size, target, shrink);
    const cr = lerp(size / 2, 44, shrink);
    rrect(CX - size / 2, CY - size / 2, size, size, cr, ACC);
    maskWord("100 %", CX, CY - 20, 300, 800, INK, 5.32, 6.75, t, { track: -10, exitUp: true });
    maskWord("de code", CX, CY + 170, 120, 500, INK, 5.62, 6.82, t, { stagger: 0.04, exitUp: true });
  }

  // ===== 4. RHYTHM (7.5 - 10.1): the square splits into a 3x3 grid that waves =====
  if (t >= 7.5 && t < 10.1) {
    const merge = io(prog(t, 9.45, 9.95));              // grid -> 9 slices of one bar
    for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) {
      const i = r * GRID + c, dc = c - 1, dr = r - 1, ring = Math.max(Math.abs(dc), Math.abs(dr));
      const split = sp(t, 7.55 + ring * 0.06, S_BOX);
      const gx = CX + dc * (CELL + GAP) * split, gy = CY - 40 + dr * (CELL + GAP) * split;
      const wave1 = sp(t, 8.25 + (r + c) * 0.07, S_UI);   // quarter turn, diagonal stagger
      const wave2 = sp(t, 8.85 + (4 - r - c) * 0.07, S_UI);
      const pulse = Math.sin(Math.PI * clamp((t - (8.85 + (4 - r - c) * 0.07)) / 0.35)) * 0.18;
      const rot = (wave1 + wave2) * Math.PI / 2;
      const sl = (BAR_X1 - BAR_X0) / 9;
      const bx = BAR_X0 + sl * (i + 0.5), by = BAR_Y;
      const x = lerp(gx, bx, merge), y = lerp(gy, by, merge);
      const w = lerp(CELL * (1 - pulse), sl + 1, merge), h = lerp(CELL * (1 - pulse), 26, merge);
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      rrect(-w / 2, -h / 2, w, h, lerp(40, 0, merge), ACC); ctx.restore();
    }
    maskWord("rythme", CX, CY + 560, 120, 500, INK, 8.05, 9.3, t, { stagger: 0.04, exitUp: true });
  }

  // ===== 5. TIMING (10.1 - 12.5): bar becomes a track, a knob runs on an eased curve =====
  if (t >= 10.1 && t < 12.5) {
    const toTrack = io(prog(t, 10.1, 10.45));
    const run = io(prog(t, 10.55, 11.75));
    const fade = io(prog(t, 11.95, 12.35));
    const kx = lerp(BAR_X0, BAR_X1, run);
    // track + fill
    ctx.save(); ctx.globalAlpha = 1 - fade;
    rrect(BAR_X0 - 13, BAR_Y - 13, BAR_X1 - BAR_X0 + 26, 26, 13, mix(ACC, TRACK, toTrack));
    if (toTrack > 0) rrect(BAR_X0 - 13, BAR_Y - 13, kx - BAR_X0 + 26, 26, 13, ACC);
    ctx.restore();
    // easing curve, drawn as the knob runs (same cubic in-out)
    const bx0 = 190, bx1 = 890, by0 = CY - 30, by1 = CY - 560;
    const draw = run, undraw = fade;
    ctx.save(); ctx.lineWidth = 12; ctx.lineCap = "round"; ctx.strokeStyle = INK;
    ctx.globalAlpha = 1 - fade;
    ctx.beginPath();
    const N = 120;
    for (let j = 0; j <= N * draw; j++) {
      const u = j / N, px = lerp(bx0, bx1, u), py = lerp(by0, by1, io(u));
      j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke(); ctx.restore();
    // axis ticks (quiet)
    ctx.fillStyle = mix(BG, MUTE, 0.55 * (1 - fade) * toTrack);
    for (let j = 0; j <= 10; j++) rrect(lerp(bx0, bx1, j / 10) - 2, by0 + 40, 4, 22, 2, ctx.fillStyle);
    // pen on the curve
    if (run > 0 && run < 1) dot(lerp(bx0, bx1, run), lerp(by0, by1, io(run)), 16, INK);
    // words swap above
    maskWord("courbe", CX, CY - 680, 110, 700, INK, 10.25, 11.0, t, { stagger: 0.035, exitUp: true });
    maskWord("timing", CX, CY - 680, 110, 700, INK, 11.15, 11.98, t, { stagger: 0.035, exitUp: true });
    // knob = the dot, keeps going into the end card
    const kr = lerp(13, 40, sp(t, 10.4, S_UI));
    if (t < 12.05) dot(kx, BAR_Y, kr);
  }

  // ===== 6. END CARD (12.0 - 15): the dot becomes the full stop of the name =====
  if (t >= 12.05) {
    const NAME1 = "Ousseynou", NAME2 = "Faye", SZ = 170;
    const w2 = textWidth(NAME2, SZ, 800);
    const y1 = CY - 40, y2 = CY + 130;
    maskWord(NAME1, CX, y1, SZ, 800, INK, 12.5, null, t, { track: -4, stagger: 0.04 });
    maskWord(NAME2, CX - 26, y2, SZ, 800, INK, 12.62, null, t, { track: -4, stagger: 0.05 });
    // full stop position after "Faye"
    const px = CX - 26 + (w2 - 4 * 3) / 2 + 34, py = y2 - 17;
    const go = sp(t, 12.05, S_TYPE);
    const arc = Math.sin(Math.PI * clamp(go)) * -220;
    dot(lerp(BAR_X1, px, go), lerp(BAR_Y, py, go) + arc, lerp(40, 19, go));
    maskWord("motion designer", CX, CY + 300, 62, 500, MUTE, 13.25, null, t, { stagger: 0.02, track: 1 });
  }
  return true;
};

// ---------- boot + preview HUD (playback is the only place a clock is used) ----------
(async () => {
  await document.fonts.load(F(800, 100)); await document.fonts.load(F(500, 100)); await document.fonts.ready;
  const q = new URLSearchParams(location.search);
  await window.seek(parseFloat(q.get("t") || "0"));
  window.ready = true;
  if (!q.has("preview")) return;
  document.body.classList.add("preview");
  let cur = 0, playing = true, last = null; const hud = document.getElementById("hud");
  const loop = (ts) => {
    if (playing) { if (last != null) cur += (ts - last) / 1000; if (cur > T) cur = 0; }
    last = ts; window.seek(cur); hud.textContent = `${cur.toFixed(2)} s  [espace] lecture  [←/→] image  [R] rejouer`;
    requestAnimationFrame(loop);
  };
  addEventListener("keydown", e => {
    if (e.code === "Space") { playing = !playing; e.preventDefault(); }
    if (e.code === "ArrowRight") { playing = false; cur = Math.min(T, cur + 1 / 30); }
    if (e.code === "ArrowLeft") { playing = false; cur = Math.max(0, cur - 1 / 30); }
    if (e.code === "KeyR") { cur = 0; playing = true; }
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
