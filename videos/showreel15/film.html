<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Showreel 15 s</title>
<style>
  @font-face { font-family: "Geist"; src: url("fonts/geist-latin.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #111; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  canvas { display: block; width: 1080px; height: 1920px; }
  body.preview canvas { height: 92vh; width: auto; }
  #hud { position: fixed; left: 12px; bottom: 12px; font: 13px/1.4 monospace; color: #ddd; background: #000a; padding: 6px 10px; border-radius: 6px; }
  body:not(.preview) #hud { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="hud"></div>
<script>
// Deterministic film: every pixel is a pure function of t (seconds). No timers, no state between frames.
const W = 1080, H = 1920, CX = W / 2, CY = H / 2, T = 15;
const BG = "#f5f5f2", INK = "#0b0b0c", ACC = "#ff6a2a", MUTE = "#8a8a85", TRACK = "#e2e2dc";
const ctx = document.getElementById("c").getContext("2d");
const F = (w, s) => `${w} ${s}px Geist`;

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const io = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = x => 1 - Math.pow(1 - clamp(x), 3);
const inn = x => Math.pow(clamp(x), 3);
const expoIO = x => (x = clamp(x), x === 0 ? 0 : x === 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
// closed-form spring step response (mass 1), 0 before t0. damping ratio >= 0.72 everywhere.
function spring(t, t0, k = 170, d = 26) {
  const x = t - t0; if (x <= 0) return 0;
  const w = Math.sqrt(k), z = d / (2 * w);
  if (z >= 1) return 1 - Math.exp(-w * x) * (1 + w * x);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
const S_UI = [320, 30], S_BOX = [170, 26], S_TYPE = [120, 24];
const sp = (t, t0, s) => spring(t, t0, s[0], s[1]);
const mix = (a, b, k) => {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(k)))).join(",")})`;
};

// ---------- drawing ----------
function rrect(x, y, w, h, r, fill) {
  w = Math.max(0, w); h = Math.max(0, h); r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}
function dot(x, y, r, fill = ACC, sx = 1, sy = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy);
  ctx.beginPath(); ctx.arc(0, 0, Math.max(0, r), 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}
// masked text: letters rise out of / fall into a clip box, staggered. inK, outK in [0,1].
function maskWord(str, x, y, size, weight, color, tIn, tOut, t, opts = {}) {
  const stag = opts.stagger ?? 0.055, align = opts.align ?? "center", track = opts.track ?? 0;
  ctx.font = F(weight, size);
  const chars = [...str], widths = chars.map(c => ctx.measureText(c).width * (c === ' ' && opts.thin ? 0.4 : 1));
  const total = widths.reduce((a, b) => a + b, 0) + track * (chars.length - 1);
  let x0 = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
  const asc = size * 0.78, desc = size * 0.26;
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - asc - size * .08, W, asc + desc + size * .16); ctx.clip();
  ctx.fillStyle = color; ctx.textBaseline = "alphabetic";
  chars.forEach((c, i) => {
    const kin = sp(t, tIn + i * stag, S_UI);
    const kout = tOut == null ? 0 : inn(prog(t, tOut + i * stag * .4, tOut + i * stag * .4 + .14));
    const dy = (1 - kin) * size * 1.3 - kout * size * 1.3 * (opts.exitUp ? 1 : -1);
    const rot = (1 - kin) * 0.12;
    ctx.save(); ctx.translate(x0 + widths[i] / 2, y + dy); ctx.rotate(rot);
    ctx.fillText(c, -widths[i] / 2, 0); ctx.restore();
    x0 += widths[i] + track;
  });
  ctx.restore();
  return total;
}
function textWidth(str, size, weight) { ctx.font = F(weight, size); return ctx.measureText(str).width; }

// ---------- scene (v2: motion + design critique applied) ----------
// 9:16 safe zone: every word sits inside y 420..1500.
const UP = CY - 240;            // dot rest position above the word
const WORD_Y = CY + 70;         // baseline of the big words
const BAR_Y = CY + 360, BAR_X0 = 110, BAR_X1 = 970;
const GRID = 3, CELL = 210, GAP = 36, GY = CY - 90, RAD = 16;
const LEFT = 96;                // end card margin (flush left)
const reach = (x, y) => Math.max(Math.hypot(x, y), Math.hypot(W - x, y), Math.hypot(x, H - y), Math.hypot(W - x, H - y)) * 1.05;

// the dot's path through shots 2-3, continuous across the handoff
function dotPath(t, xr) {
  const back = sp(t, 3.12, S_UI);                  // remnant -> parked top right, clear of DESIGN
  const go = sp(t, 4.45, S_BOX);                   // parked -> centre, already moving when the flood starts
  const ax = xr - 62, ay = UP, bx = CX + 400, by = UP - 40;
  return [lerp(lerp(ax, bx, back), CX, go), lerp(lerp(ay, by, back), CY, go), back];
}

window.seek = async (t) => {
  t = clamp(t, 0, T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const cam = 1 + 0.006 * Math.sin(Math.min(t, 12.97) * 0.9);   // final hold is still: no shimmer on the name
  ctx.translate(CX, CY); ctx.scale(cam, cam); ctx.translate(-CX, -CY);

  // ===== 1. HOOK (0 - 2.4): the dot falls under gravity, lands, lifts; MOTION rises =====
  if (t < 2.1) {
    const f = prog(t, -0.15, 0.36);
    let y = lerp(-140, CY, f * f);                 // accelerating fall, impact at full speed
    const land = Math.max(0, t - 0.36);
    const squash = t > 0.36 ? Math.exp(-land * 15) * Math.sin(land * 14) * 1.6 : 0;   // damping ratio ~0.73
    y = lerp(y, UP, sp(t, 0.52, S_BOX));
    dot(CX, y, 62, ACC, 1 + 0.22 * squash, 1 - 0.22 * squash);
    maskWord("MOTION", CX, WORD_Y, 218, 800, INK, 0.9, null, t, { track: -6 });
  }

  // ===== 2. DESIGN (2.4 - 4.55): the dot stretches into a bar that wipes MOTION into DESIGN =====
  let xr = CX + 450;
  if (t >= 2.1 && t < 4.67) {
    const s = sp(t, 2.1, S_UI);
    const cover = io(prog(t, 2.40, 2.75));
    const ret = io(prog(t, 2.80, 3.12));
    if (t < 2.77) maskWord("MOTION", CX, WORD_Y, 218, 800, INK, -9, null, t, { track: -6 });
    else maskWord("DESIGN", CX, WORD_Y, 218, 800, INK, -9, 4.22, t, { track: -6, stagger: 0.035 });
    let w = lerp(124, 900, s), h = lerp(124, 26, s);
    const cy = lerp(UP, WORD_Y - 80, cover); h = lerp(h, 270, cover);
    let x = CX - w / 2; xr = CX + w / 2;
    x = lerp(x, xr - 124, ret); h = lerp(h, 124, ret);
    const cyR = lerp(cy, UP, ret);                     // the pill lifts off the word while it retracts
    if (t < 3.12) rrect(x, cyR - h / 2, xr - x, h, h / 2, ACC);
    else { const [px, py] = dotPath(t, xr); dot(px, py, 62); }
  }

  // ===== 3. FLOOD (4.55 - 7.3): the moving dot floods the frame, "100%" / "code", contracts to a cell =====
  if (t >= 4.67 && t < 7.23) {
    const [px, py] = dotPath(t, CX + 450);
    const g = io(prog(t, 4.67, 5.17));
    const shrink = io(prog(t, 6.76, 7.21));
    let size = lerp(124, reach(px, py) * 2, g);
    size = lerp(size, CELL, shrink);
    const cx = lerp(px, CX, shrink), cy = lerp(py, GY, shrink);
    const cr = lerp(size / 2, RAD, shrink);
    rrect(cx - size / 2, cy - size / 2, size, size, cr, ACC);
    maskWord("100 %", CX, CY - 20, 300, 800, INK, 5.2, 6.45, t, { track: -10, exitUp: true, thin: true });
    maskWord("code", CX, CY + 170, 130, 700, INK, 5.42, 6.55, t, { stagger: 0.04, exitUp: true });
  }

  // ===== 4. RHYTHM (7.3 - 10.05): the cell splits into a 3x3 grid, two waves, merges into the track =====
  if (t >= 7.23 && t < 10.05) {
    const merge = io(prog(t, 9.65, 10.05));
    const sl = (BAR_X1 - BAR_X0 + 26) / 9;
    for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) {
      const i = r * GRID + c, dc = c - 1, dr = r - 1, ring = Math.max(Math.abs(dc), Math.abs(dr));
      const split = sp(t, 7.23 + ring * 0.06, S_BOX);
      const gx = CX + dc * (CELL + GAP) * split, gy = GY + dr * (CELL + GAP) * split;
      const w1 = 8.38 + (r + c) * 0.07, w2 = 8.92 + (4 - r - c) * 0.07;
      const rot = (sp(t, w1, S_UI) + sp(t, w2, S_UI)) * Math.PI / 2;
      const pulse = Math.sin(Math.PI * clamp((t - w2) / 0.35)) * 0.18;
      const bx = BAR_X0 - 13 + sl * (i + 0.5);
      const x = lerp(gx, bx, merge), y = lerp(gy, BAR_Y, merge);
      const w = lerp(CELL * (1 - pulse), sl + 1, merge), h = lerp(CELL * (1 - pulse), 26, merge);
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      rrect(-w / 2, -h / 2, w, h, lerp(RAD, i === 0 || i === 8 ? 13 : 0, merge), ACC); ctx.restore();
    }
    maskWord("rythme", CX, CY + 470, 120, 700, INK, 7.88, 9.45, t, { stagger: 0.03, exitUp: true });
  }

  // ===== 5. TIMING (10.05 - 12.1): the bar becomes a track, the knob runs as the easing curve draws =====
  if (t >= 10.05 && t < 11.6) {
    const toTrack = io(prog(t, 10.05, 10.35));
    const run = io(prog(t, 10.50, 11.50));
    const fade = io(prog(t, 11.36, 11.60));
    const kx = lerp(BAR_X0, BAR_X1, run);
    ctx.save(); ctx.globalAlpha = 1 - fade;
    rrect(BAR_X0 - 13, BAR_Y - 13, BAR_X1 - BAR_X0 + 26, 26, 13, mix(ACC, TRACK, toTrack));
    if (toTrack > 0) rrect(BAR_X0 - 13, BAR_Y - 13, kx - BAR_X0 + 26, 26, 13, ACC);
    // easing curve, same width as the track, drawn by the same eased progress
    const by0 = CY + 240, by1 = CY - 240;
    ctx.lineWidth = 8; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = INK;
    ctx.beginPath();
    const N = 160;
    for (let j = 0; j <= N * run; j++) {
      const u = j / N, px = lerp(BAR_X0, BAR_X1, u), py = lerp(by0, by1, io(u));
      j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    if (run > 0.12) ctx.stroke();
    ctx.restore();
    maskWord("timing", CX, CY - 340, 120, 700, INK, 10.05, 11.28, t, { stagger: 0.035, exitUp: true });
    const kr = lerp(13, 40, sp(t, 10.42, S_UI));
    if (t < 11.50) dot(kx, BAR_Y, kr);
  }

  // ===== 6. SIGNATURE (11.62 - 15): the knob is thrown into the full stop of the name, flush left =====
  if (t >= 11.50) {
    const NAME1 = "Ousseynou", NAME2 = "Faye", SZ = 160;
    const w2 = textWidth(NAME2, SZ, 800) - 3 * 4;
    const y1 = CY - 100, y2 = CY + 65;
    maskWord(NAME1, LEFT, y1, SZ, 800, INK, 11.62, null, t, { track: -4, stagger: 0.04, align: "left" });
    maskWord(NAME2, LEFT, y2, SZ, 800, INK, 11.70, null, t, { track: -4, stagger: 0.05, align: "left" });
    const px = LEFT + w2 + 32, py = y2 - 16;
    const go = sp(t, 11.50, [120, 20]);
    const arc = Math.sin(Math.PI * clamp(go)) * -140;
    dot(lerp(BAR_X1, px, go), lerp(BAR_Y, py, go) + arc, lerp(40, 18, go * go));
    maskWord("motion designer", LEFT + 4, CY + 225, 76, 600, INK, 12.45, null, t, { stagger: 0.02, align: "left" });
  }
  return true;
};

// ---------- boot + preview HUD (playback is the only place a clock is used) ----------
(async () => {
  await document.fonts.load(F(800, 100)); await document.fonts.load(F(500, 100)); await document.fonts.ready;
  const q = new URLSearchParams(location.search);
  await window.seek(parseFloat(q.get("t") || "0"));
  window.ready = true;
  if (!q.has("preview")) return;
  document.body.classList.add("preview");
  let cur = 0, playing = true, last = null; const hud = document.getElementById("hud");
  const loop = (ts) => {
    if (playing) { if (last != null) cur += (ts - last) / 1000; if (cur > T) cur = 0; }
    last = ts; window.seek(cur); hud.textContent = `${cur.toFixed(2)} s  [espace] lecture  [←/→] image  [R] rejouer`;
    requestAnimationFrame(loop);
  };
  addEventListener("keydown", e => {
    if (e.code === "Space") { playing = !playing; e.preventDefault(); }
    if (e.code === "ArrowRight") { playing = false; cur = Math.min(T, cur + 1 / 30); }
    if (e.code === "ArrowLeft") { playing = false; cur = Math.max(0, cur - 1 / 30); }
    if (e.code === "KeyR") { cur = 0; playing = true; }
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
