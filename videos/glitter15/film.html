<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glitter ad 15 s</title>
<style>
  @font-face { font-family: "Outfit"; src: url("fonts/outfit-latin.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #111; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  canvas { display: block; width: 1080px; height: 1920px; }
  body.preview canvas { height: 92vh; width: auto; }
  #hud { position: fixed; left: 12px; bottom: 12px; font: 13px/1.4 monospace; color: #ddd; background: #000a; padding: 6px 10px; border-radius: 6px; }
  body:not(.preview) #hud { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="hud"></div>
<script type="module">
import * as THREE from "./vendor/three.module.min.js";
import { RoomEnvironment } from "./vendor/RoomEnvironment.js";
import { RoundedBoxGeometry } from "./vendor/RoundedBoxGeometry.js";
// Spec ad for the Glitter golf-training app (v2: realistic 3D phone, unmasked text).
// Pure function of t (seconds) in window.seek(t). App screens are an ILLUSTRATION (labelled on screen);
// only the two features from the reference board are shown: easy access to training, personalized training.
const W = 1080, H = 1920, CX = W / 2, CY = H / 2, T = 15;
const LOGO_LIME = "#9bf754";
const LIME = "#b6f36c", SLATE = "#16282d", SLATE2 = "#22383e", WHITE = "#f6f8f4", INK = "#0e1a1d", RED = "#ff3b30";
const ctx = document.getElementById("c").getContext("2d");
const F = (w, s) => `${w} ${s}px Outfit`;

// ---------- official logo (supplied PNG) ----------
const logoIcon = new Image(); logoIcon.src = "assets/logo-icon.png";      // full app icon, tile included
const logoMark = new Image(); logoMark.src = "assets/logo-mark.png";      // the green mark alone, transparent
const MARK_AR = 849 / 590;

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const io = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = x => 1 - Math.pow(1 - clamp(x), 3);
const out5 = x => 1 - Math.pow(1 - clamp(x), 5);
const inn = x => Math.pow(clamp(x), 3);
function spring(t, t0, k = 170, d = 26) {
  const x = t - t0; if (x <= 0) return 0;
  const w = Math.sqrt(k), z = d / (2 * w);
  if (z >= 1) return 1 - Math.exp(-w * x) * (1 + w * x);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
const S_UI = [320, 30], S_BOX = [170, 22], S_TYPE = [120, 20], S_PHONE = [90, 15];
const sp = (t, t0, s) => spring(t, t0, s[0], s[1]);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(k)))).join(",")})`; };

// ---------- drawing helpers (take a context so they work on- and off-screen) ----------
function rrect(g, x, y, w, h, r, fill) {
  w = Math.max(0, w); h = Math.max(0, h); r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = fill; g.fill();
}
function circle(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function text(g, str, x, y, size, weight, color, align = "left", alpha = 1) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = F(weight, size); g.fillStyle = color; g.textAlign = align; g.textBaseline = "alphabetic";
  g.fillText(str, x, y); g.restore();
}
// Unmasked text reveal: each letter fades in, sharpens from a blur and settles up into place (no clip, no mask).
function revealText(str, x, y, size, weight, color, tIn, tOut, t, opts = {}) {
  const stag = opts.stagger ?? 0.035, align = opts.align ?? "left", track = opts.track ?? 0;
  ctx.font = F(weight, size);
  const chars = [...str], widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + track * (chars.length - 1);
  let x0 = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
  chars.forEach((c, i) => {
    const kin = sp(t, tIn + i * stag, S_UI);
    const e = tOut == null ? 0 : out(prog(t, tOut + i * stag * 0.4, tOut + i * stag * 0.4 + 0.22));
    const a = clamp(kin * 1.25) * (1 - e);
    if (a > 0.003 && c !== " ") {
      const blur = Math.max(0, 1 - kin) * size * 0.09 + e * size * 0.07;
      const dy = (1 - kin) * size * 0.32 - e * size * 0.22;
      const sc = lerp(0.94, 1, clamp(kin));
      ctx.save(); ctx.globalAlpha = a; if (blur > 0.4) ctx.filter = `blur(${blur.toFixed(1)}px)`;
      ctx.translate(x0 + widths[i] / 2, y + dy); ctx.scale(sc, sc);
      ctx.font = F(weight, size); ctx.fillStyle = color; ctx.textBaseline = "alphabetic"; ctx.fillText(c, -widths[i] / 2, 0);
      ctx.restore();
    }
    x0 += widths[i] + track;
  });
}
// golf ball with dimples that slide with the roll
function ball(g, x, y, r, roll, dimpleK = 1, fill = WHITE) {
  g.save(); g.translate(x, y);
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip();
  g.fillStyle = fill; g.fillRect(-r, -r, 2 * r, 2 * r);
  if (dimpleK > 0) {
    const s = r * 0.24, off = ((roll * r) % s + s) % s;
    g.fillStyle = `rgba(14,26,29,${0.10 * dimpleK})`;
    for (let gy = -r - s; gy < r + s; gy += s * 0.86) for (let gx = -r - 2 * s; gx < r + 2 * s; gx += s) {
      const row = Math.round(gy / (s * .86)); const px = gx + off + (row % 2 ? s / 2 : 0);
      const d = Math.hypot(px, gy) / r; if (d > 0.96) continue;
      const rr = s * 0.28 * Math.sqrt(1 - d * d);
      g.beginPath(); g.ellipse(px, gy, rr * Math.sqrt(1 - d * d) + rr * .2, rr, Math.atan2(gy, px), 0, Math.PI * 2); g.fill();
    }
  }
  const gr = g.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r * 1.05);
  gr.addColorStop(0, "rgba(255,255,255,0.25)"); gr.addColorStop(0.7, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(14,26,29,0.22)");
  g.fillStyle = gr; g.fillRect(-r, -r, 2 * r, 2 * r);
  g.restore();
}
// Glitter mark = the supplied logo. u = size unit (width = 1.7u). k = build: scales in with a small turn.
function mark(g, x, y, u, k = 1) {
  const a = clamp(k); if (a <= 0) return;
  const w = u * 1.7 * (0.6 + 0.4 * out(a)), h = w / MARK_AR;
  g.save(); g.globalAlpha *= clamp(a * 2); g.translate(x, y); g.rotate((1 - out(a)) * -0.25);
  g.drawImage(logoMark, -w / 2, -h / 2, w, h); g.restore();
}
// the app icon = the supplied icon PNG (+ optional notification badge)
function appIcon(g, cx, cy, s, markK = 1, badgeK = 0, alpha = 1) {
  g.save(); g.globalAlpha *= alpha; g.shadowColor = "rgba(14,26,29,0.30)"; g.shadowBlur = s * 0.14; g.shadowOffsetY = s * 0.07;
  g.drawImage(logoIcon, cx - s / 2, cy - s / 2, s, s); g.restore();
  if (badgeK > 0) {
    const bx = cx + s / 2 - s * 0.06, by = cy - s / 2 + s * 0.06;
    circle(g, bx, by, s * 0.13 * badgeK, RED);
    text(g, "1", bx, by + s * 0.05 * badgeK, s * 0.15 * badgeK, 700, "#fff", "center");
  }
}
function lineIcon(g, kind, x, y, s, col) {
  g.save(); g.translate(x, y); g.strokeStyle = col; g.fillStyle = col; g.lineWidth = s * 0.11; g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath();
  if (kind === "home") { g.moveTo(-s * .42, -s * .02); g.lineTo(0, -s * .4); g.lineTo(s * .42, -s * .02); g.moveTo(-s * .3, -s * .12); g.lineTo(-s * .3, s * .38); g.lineTo(s * .3, s * .38); g.lineTo(s * .3, -s * .12); g.stroke(); }
  if (kind === "play") { g.arc(0, 0, s * .4, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.moveTo(-s * .1, -s * .16); g.lineTo(s * .18, 0); g.lineTo(-s * .1, s * .16); g.closePath(); g.fill(); }
  if (kind === "plan") { [-.3, 0, .3].forEach(v => { g.moveTo(-s * .2, v * s); g.lineTo(s * .38, v * s); }); g.stroke(); [-.3, 0, .3].forEach(v => { g.beginPath(); g.arc(-s * .36, v * s, s * .05, 0, 7); g.fill(); }); }
  if (kind === "user") { g.arc(0, -s * .14, s * .17, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.arc(0, s * .42, s * .32, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); }
  g.restore();
}
// generic frosted home-screen icons (no third-party brands)
function homeIcon(g, kind, cx, cy, s) {
  rrect(g, cx - s / 2, cy - s / 2, s, s, s * 0.235, "rgba(246,248,244,0.16)");
  g.save(); g.strokeStyle = WHITE; g.fillStyle = WHITE; g.lineWidth = s * 0.06; g.lineCap = "round";
  if (kind === "cal") { text(g, "31", cx, cy + s * 0.2, s * 0.46, 600, WHITE, "center"); text(g, "MON", cx, cy - s * 0.2, s * 0.15, 600, LIME, "center"); }
  if (kind === "clock") { g.beginPath(); g.arc(cx, cy, s * 0.3, 0, 7); g.stroke(); g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, cy - s * 0.2); g.moveTo(cx, cy); g.lineTo(cx + s * 0.14, cy + s * 0.06); g.stroke(); }
  if (kind === "weather") { circle(g, cx + s * 0.1, cy - s * 0.08, s * 0.16, LIME); rrect(g, cx - s * 0.28, cy - s * 0.02, s * 0.5, s * 0.22, s * 0.11, WHITE); }
  if (kind === "notes") { [-.12, .02, .16].forEach(v => { g.beginPath(); g.moveTo(cx - s * 0.22, cy + v * s); g.lineTo(cx + s * 0.22, cy + v * s); g.stroke(); }); }
  if (kind === "photos") { circle(g, cx - s * 0.1, cy - s * 0.05, s * 0.16, "rgba(182,243,108,0.9)"); circle(g, cx + s * 0.1, cy + s * 0.05, s * 0.16, "rgba(246,248,244,0.75)"); }
  if (kind === "mail") { g.strokeRect(cx - s * 0.26, cy - s * 0.17, s * 0.52, s * 0.34); g.beginPath(); g.moveTo(cx - s * 0.26, cy - s * 0.17); g.lineTo(cx, cy + s * 0.04); g.lineTo(cx + s * 0.26, cy - s * 0.17); g.stroke(); }
  if (kind === "msg") { rrect(g, cx - s * 0.26, cy - s * 0.2, s * 0.52, s * 0.34, s * 0.12, WHITE); }
  if (kind === "camera") { g.strokeRect(cx - s * 0.26, cy - s * 0.15, s * 0.52, s * 0.32); g.beginPath(); g.arc(cx, cy + s * 0.01, s * 0.1, 0, 7); g.stroke(); }
  g.restore();
}

// ---------- the phone: a Three.js model, its screen a live canvas texture ----------
const PW = 600, PHH = 1240, BEZ = 16, SW = PW - 2 * BEZ, SH = PHH - 2 * BEZ, BODY_R = 96, SCR_R = 80, DEPTH = 52;
const scr = document.createElement("canvas"); scr.width = SW; scr.height = SH;
const sg = scr.getContext("2d");
const SLOT = { x: BEZ + 40 + 61 + 2 * 122, y: BEZ + 400 + 170, s: 100 };      // Glitter icon on the home screen (phone coords, centre)

function drawPhoneFlat(t, st) {
  const g = sg; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, SW, SH);
  g.save(); g.beginPath(); g.roundRect(0, 0, SW, SH, SCR_R); g.clip();
  drawScreen(g, t, st);
  rrect(g, SW / 2 - 92, 22, 184, 54, 27, "#020304");                        // dynamic island + camera
  circle(g, SW / 2 + 56, 49, 11, "#0d1a2a"); circle(g, SW / 2 + 53, 46, 3.5, "rgba(120,160,255,0.5)");
  const sx = SW * (0.15 + st.rotY / 90);                                    // glass sheen that slides as the phone turns
  const sh = g.createLinearGradient(sx - 300, 0, sx + 300, SH * 0.6);
  sh.addColorStop(0, "rgba(255,255,255,0)"); sh.addColorStop(0.5, "rgba(255,255,255,0.08)"); sh.addColorStop(0.52, "rgba(255,255,255,0.03)"); sh.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sh; g.fillRect(0, 0, SW, SH);
  g.restore();
  screenTex.needsUpdate = true;
}
function statusBar(g, t, col = WHITE) {
  text(g, "9:41", 66, 62, 30, 600, col);
  for (let i = 0; i < 4; i++) rrect(g, SW - 168 + i * 11, 54 - (i + 1) * 5.5, 7, (i + 1) * 5.5 + 2, 2, col);
  g.save(); g.strokeStyle = col; g.lineWidth = 3.5; g.lineCap = "round";
  for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(SW - 104, 60, 6 + i * 7, Math.PI * 1.25, Math.PI * 1.75); g.stroke(); }
  g.restore();
  g.save(); g.strokeStyle = col; g.globalAlpha = 0.6; g.lineWidth = 2.5; g.beginPath(); g.roundRect(SW - 82, 40, 44, 22, 7); g.stroke(); g.restore();
  rrect(g, SW - 79, 43, 34, 16, 4, col);
}
function drawScreen(g, t, st) {
  // ---- home screen ----
  const wall = g.createLinearGradient(0, 0, SW, SH);
  wall.addColorStop(0, "#1e3a3a"); wall.addColorStop(1, "#0d1a1d");
  g.fillStyle = wall; g.fillRect(0, 0, SW, SH);
  circle(g, SW * 0.8, SH * 0.25, 260, "rgba(182,243,108,0.10)");
  circle(g, SW * 0.15, SH * 0.78, 200, "rgba(182,243,108,0.06)");
  const apps = [["cal", "Calendar"], ["clock", "Clock"], ["weather", "Weather"], ["notes", "Notes"], ["photos", "Photos"], ["camera", "Camera"], [null, "Glitter"], ["msg", "Messages"]];
  apps.forEach(([k, label], i) => {
    const col = i % 4, row = Math.floor(i / 4);
    const cx = 40 + 61 + col * 122, cy = 400 + row * 170;
    if (k) homeIcon(g, k, cx, cy, 100);
    text(g, label, cx, cy + 80, 21, 500, "rgba(246,248,244,0.85)", "center");
  });
  // the Glitter icon lands in its slot (drawn by the main canvas while it flies, then here)
  const sx = SLOT.x - BEZ, sy = SLOT.y - BEZ;
  if (st.iconInPhone) {
    const press = st.press;                                     // tap: quick dip and release
    appIcon(g, sx, sy, SLOT.s * (1 - 0.1 * press), 1, st.badge);
    if (st.tap > 0) { g.save(); g.globalAlpha = 0.35 * (1 - st.tap); circle(g, sx, sy, 30 + 70 * st.tap, WHITE); g.restore(); }
  }
  rrect(g, 30, SH - 170, SW - 60, 130, 44, "rgba(246,248,244,0.14)");   // dock
  ["mail", "msg", "camera", "photos"].forEach((k, i) => homeIcon(g, k, 30 + (SW - 60) * (i + 0.5) / 4, SH - 105, 96));
  // ---- the app opens from the icon (iOS-style zoom) ----
  if (st.open > 0) {
    const o = st.open;
    const w = lerp(SLOT.s, SW, o), h = lerp(SLOT.s, SH, o), x = lerp(sx - SLOT.s / 2, 0, o), y = lerp(sy - SLOT.s / 2, 0, o);
    g.save(); g.beginPath(); g.roundRect(x, y, w, h, lerp(SLOT.s * 0.235, SCR_R, o)); g.clip();
    g.fillStyle = SLATE; g.fillRect(x, y, w, h);
    const cx1 = lerp(sx + SLOT.s * 0.04, SW / 2, o), cy1 = lerp(sy, SH * 0.45, o);
    mark(g, lerp(cx1, 74, st.header), lerp(cy1, 150, st.header), lerp(lerp(SLOT.s * 0.42, 120, o), 46, st.header), 1);
    if (st.header > 0) drawApp(g, t, st);
    g.restore();
  }
  statusBar(g, t);
}
function drawApp(g, t, st) {
  const ui = (t0) => sp(t, t0, S_UI);
  text(g, "Glitter", 120, 166, 46, 700, WHITE, "left", out(prog(t, 5.55, 5.8)));
  text(g, "Illustration", SW - 40, 166, 26, 500, "rgba(246,248,244,0.55)", "right", out(prog(t, 5.6, 5.9)));
  const swap = io(prog(t, 7.1, 7.45));
  // page A: easy access to training
  g.save(); g.translate(-swap * SW, 0);
  const a1 = ui(5.6);
  text(g, "Today's training", 50, 290 + (1 - a1) * 40, 58, 700, WHITE, "left", clamp(a1));
  const cards = [["Putting", "12 min", LIME, SLATE], ["Chipping", "8 min", SLATE2, WHITE], ["Driving range", "15 min", SLATE2, WHITE], ["Bunker shots", "10 min", SLATE2, WHITE]];
  cards.forEach(([n, d, bg, fg], i) => {
    const k = ui(5.72 + i * 0.07), cy = 360 + i * 170 + (1 - k) * 80;
    g.save(); g.globalAlpha *= clamp(k);
    rrect(g, 40, cy, SW - 80, 146, 34, bg);
    text(g, n, 80, cy + 66, 40, 600, fg); text(g, d, 80, cy + 112, 28, 400, i === 0 ? SLATE : "rgba(246,248,244,0.6)");
    circle(g, SW - 110, cy + 73, 38, i === 0 ? SLATE : LIME);
    g.beginPath(); const px = SW - 110, py = cy + 73; g.moveTo(px - 9, py - 15); g.lineTo(px + 15, py); g.lineTo(px - 9, py + 15); g.closePath(); g.fillStyle = i === 0 ? LIME : SLATE; g.fill();
    g.restore();
  });
  g.restore();
  // page B: personalized plan
  g.save(); g.translate((1 - swap) * SW, 0);
  text(g, "Your plan", 50, 290, 58, 700, WHITE);
  text(g, "Built around your level", 50, 340, 30, 400, "rgba(246,248,244,0.6)");
  ["Warm-up routine", "Short game focus", "Putting under pressure", "Review your swing"].forEach((s, i) => {
    const k = sp(t, 7.4 + i * 0.09, S_UI), cy = 410 + i * 150 + (1 - k) * 60;
    g.save(); g.globalAlpha *= clamp(k);
    rrect(g, 40, cy, SW - 80, 126, 32, SLATE2);
    const done = i < 2;
    circle(g, 104, cy + 63, 26, done ? LIME : "rgba(246,248,244,0.15)");
    if (done) { g.save(); g.strokeStyle = SLATE; g.lineWidth = 6; g.lineCap = "round"; g.beginPath(); g.moveTo(92, cy + 64); g.lineTo(101, cy + 73); g.lineTo(117, cy + 54); g.stroke(); g.restore(); }
    text(g, s, 152, cy + 76, 34, 500, WHITE);
    g.restore();
  });
  g.restore();
  // floating dock with a sliding pill + a real tap on the second tab
  const dk = ui(5.9), dy = SH - 150 + (1 - dk) * 200, dw = SW - 120, dx = 60;
  rrect(g, dx, dy, dw, 110, 55, "rgba(5,9,10,0.88)");
  const slot = dw / 4, pos = io(prog(t, 6.95, 7.25));
  rrect(g, dx + 10 + slot * pos, dy + 10, slot - 20, 90, 45, LIME);
  ["home", "play", "plan", "user"].forEach((k, i) => {
    const on = i === 0 ? 1 - pos : i === 1 ? pos : 0;
    lineIcon(g, k, dx + slot * (i + 0.5), dy + 55, 46, mix("#f6f8f4", SLATE, on));
  });
  const tap = prog(t, 6.85, 7.25);
  if (tap > 0 && tap < 1) { g.save(); g.globalAlpha = 0.35 * (1 - tap); circle(g, dx + slot * 1.5, dy + 55, 26 + 60 * out(tap), WHITE); g.restore(); }
}

// Three.js scene (threejs-webgl skill): physical titanium body, black glass front, buttons, studio environment.
// 1 world unit = 1 px at z = 0, so the phone sits exactly where the 2D layout expects it.
const glc = document.createElement("canvas"); glc.width = W; glc.height = H;
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const DIST = (H / 2) / Math.tan(15 * Math.PI / 180);
const camera = new THREE.PerspectiveCamera(30, W / H, 10, DIST * 4); camera.position.set(0, 0, DIST); camera.lookAt(0, 0, 0);
const keyL = new THREE.DirectionalLight(0xffffff, 1.4); keyL.position.set(-900, 1400, 1800); scene.add(keyL);
const rimL = new THREE.DirectionalLight(0xe8fff0, 1.0); rimL.position.set(1800, 200, -300); scene.add(rimL);
function rrShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);
  s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  return s;
}
const phone = new THREE.Group(); scene.add(phone);
const BEV = 9, D0 = DEPTH - 2 * BEV, FRONT = DEPTH / 2;
const titanium = new THREE.MeshPhysicalMaterial({ color: 0x9aa2a7, metalness: 1, roughness: 0.3, clearcoat: 0.4, clearcoatRoughness: 0.2 });
const bodyGeo = new THREE.ExtrudeGeometry(rrShape(PW - 2 * BEV, PHH - 2 * BEV, BODY_R - BEV), { depth: D0, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV, bevelSegments: 6, curveSegments: 40 });
bodyGeo.translate(0, 0, -D0 / 2);
phone.add(new THREE.Mesh(bodyGeo, titanium));
const glass = new THREE.Mesh(new THREE.ShapeGeometry(rrShape(PW - 8, PHH - 8, BODY_R - 4), 40),
  new THREE.MeshPhysicalMaterial({ color: 0x040607, roughness: 0.06, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03 }));
glass.position.z = FRONT + 0.4; phone.add(glass);
const screenTex = new THREE.CanvasTexture(scr); screenTex.colorSpace = THREE.SRGBColorSpace; screenTex.anisotropy = 4;
const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ map: screenTex, transparent: true, toneMapped: false }));
screenMesh.position.z = FRONT + 0.8; phone.add(screenMesh);
[[-1, 0.235, 0.05], [-1, 0.32, 0.085], [-1, 0.42, 0.085], [1, 0.33, 0.14]].forEach(([side, p, l]) => {     // action, volume, power
  const b = new THREE.Mesh(new RoundedBoxGeometry(10, PHH * l, 16, 3, 4), titanium);
  b.position.set(side * (PW / 2 + 2), PHH / 2 - PHH * p - PHH * l / 2, 0); phone.add(b);
});
const _v = new THREE.Vector3();
function placePhone(cy, rotY, rotZ) {
  phone.position.set(0, CY - cy, 0);
  phone.rotation.set(0, rotY * Math.PI / 180, rotZ * Math.PI / 180, "ZYX");
  phone.updateMatrixWorld(true);
}
function toScreen(px, py) {           // phone coords (px from left, py from top, on the glass) -> canvas px
  _v.set(px - PW / 2, PHH / 2 - py, FRONT + 1); phone.localToWorld(_v); _v.project(camera);
  return { x: (_v.x + 1) / 2 * W, y: (1 - _v.y) / 2 * H };
}
function drawPhone3D(cy, rotY, rotZ) {
  placePhone(cy, rotY, rotZ);
  const c = toScreen(PW / 2, PHH / 2), cos = Math.abs(Math.cos(rotY * Math.PI / 180));
  ctx.save(); ctx.filter = "blur(40px)"; ctx.globalAlpha = 0.30; ctx.fillStyle = INK;           // soft drop shadow on the backdrop
  ctx.beginPath(); ctx.roundRect(c.x - PW * 0.42 * cos + 34, c.y - PHH / 2 + 80, PW * 0.84 * cos, PHH, 90); ctx.fill(); ctx.restore();
  renderer.render(scene, camera);
  ctx.drawImage(glc, 0, 0);
}
function projectPoint(px, py, rotY, rotZ, cy) {
  placePhone(cy, rotY, rotZ);
  const a = toScreen(px, py), b = toScreen(px + 50, py);
  return { x: a.x, y: a.y, k: Math.hypot(b.x - a.x, b.y - a.y) / 50 };
}

// ---------- layout ----------
const LEFT = 96, GROUND = 1240, ICON_Y = CY - 120, ICON_S = 400;
const PH_CY = 1260;                                   // phone centre at rest (top edge ~640, text above stays in the safe zone)

window.seek = async (t) => {
  t = clamp(t, 0, T);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = "none";
  ctx.fillStyle = LIME; ctx.fillRect(0, 0, W, H);

  // ===== 1-3. ball -> icon -> mark (0 - 4.5) =====
  const rollK = out5(prog(t, 0, 1.0));
  const bx1 = lerp(-140, CX + 170, rollK), roll = (bx1 + 140) / 120;
  const rise = sp(t, 2.35, S_BOX), iconK = sp(t, 2.42, S_BOX);
  const markK = io(prog(t, 2.75, 3.35)), toMark = io(prog(t, 2.68, 3.0));
  const badge = sp(t, 3.55, S_UI);
  // ===== 4. phone (4.3 - 9.4) =====
  const enter = sp(t, 4.25, S_PHONE);                          // phone rises from below, turned, and settles face-on
  const turn1 = io(prog(t, 6.85, 7.5)), turn2 = io(prog(t, 8.3, 8.9));
  const exitK = inn(prog(t, 9.05, 9.45));
  const rotY = lerp(-34, 0, enter) + turn1 * 10 - turn2 * 10 + exitK * -78;
  const rotZ = lerp(-7, 0, enter) + exitK * -6;
  const pcy = lerp(PH_CY + 1300, PH_CY, enter) + exitK * 1300;
  const fly = io(prog(t, 4.45, 4.95));                          // icon flies into its home-screen slot
  const iconInPhone = t >= 4.95;
  const press = Math.sin(Math.PI * prog(t, 5.0, 5.18));
  const tapK = prog(t, 5.02, 5.4);
  const open = io(prog(t, 5.15, 5.55)), header = io(prog(t, 5.4, 5.75));

  if (t < 4.95) {
    const bx = lerp(bx1, CX, rise), by = lerp(GROUND - 110, ICON_Y, rise), br = lerp(110, ICON_S * 0.2, rise);
    if (rise < 1) { ctx.save(); ctx.globalAlpha = 0.18 * (1 - rise); ctx.beginPath(); ctx.ellipse(bx, GROUND + 4, br * 0.9, br * 0.16, 0, 0, 7); ctx.fillStyle = INK; ctx.fill(); ctx.restore(); }
    if (t >= 4.25) drawPhoneFrame(t, rotY, rotZ, pcy, { iconInPhone: false, press: 0, tap: 0, badge: 0, open: 0, header: 0 });
    // the icon (tile grows around the ball, then flies into the phone's slot)
    const s0 = ICON_S * iconK;
    const P = projectPoint(SLOT.x, SLOT.y, rotY, rotZ, pcy);
    const tgtX = P.x, tgtY = P.y;
    const icx = lerp(bx, tgtX, fly), icy = lerp(by, tgtY, fly) - Math.sin(Math.PI * fly) * 80, isz = lerp(s0, SLOT.s * P.k, fly);
    if (iconK > 0.001) {
      ctx.save(); ctx.shadowColor = "rgba(14,26,29,0.28)"; ctx.shadowBlur = 60 * iconK; ctx.shadowOffsetY = 30 * iconK;
      rrect(ctx, icx - isz / 2, icy - isz / 2, isz, isz, isz * 0.235, SLATE); ctx.restore();
    }
    if (toMark < 1) ball(ctx, icx, icy, br * lerp(1, SLOT.s / ICON_S, fly), roll, 1 - toMark, mix(WHITE, LOGO_LIME, toMark));
    if (markK > 0 && iconK > 0) appIcon(ctx, icx, icy, isz, 1, badge, markK);      // the supplied icon resolves over the tile
  } else if (t < 9.5) {
    drawPhoneFrame(t, rotY, rotZ, pcy, { iconInPhone, press, tap: tapK, badge: 1 - open, open, header });
  }

  // copy (unmasked reveals)
  revealText("Iconic golf", LEFT, 640, 150, 700, INK, 0.7, 2.15, t);
  revealText("starts here.", LEFT, 800, 150, 700, INK, 0.82, 2.2, t);
  revealText("Now on your phone.", CX, 1420, 84, 600, INK, 3.0, 4.2, t, { align: "center", stagger: 0.02 });
  revealText("Easy access", LEFT, 470, 92, 700, INK, 5.6, 6.95, t);
  revealText("to training", LEFT, 570, 92, 700, INK, 5.7, 7.0, t);
  revealText("Personalized", LEFT, 470, 92, 700, INK, 7.25, 8.95, t);
  revealText("training", LEFT, 570, 92, 700, INK, 7.35, 9.0, t);

  // ===== 5. LEARN. PLAY. SHINE. (9.1 - 11.5) =====
  const panels = [[9.1, SLATE, LIME, "Learn."], [9.85, LIME, SLATE, "Play."], [10.6, SLATE, LIME, "Shine."]];
  panels.forEach(([t0, bg, fg, word], i) => {
    const k = io(prog(t, t0, t0 + 0.32));
    if (k <= 0) return;
    const top = lerp(H, 0, k);
    rrect(ctx, 0, top, W, H - top + 2, lerp(120, 0, k), bg);
    const next = panels[i + 1];
    revealText(word, CX, CY + 80, 230, 800, fg, t0 + 0.16, next ? next[0] + 0.02 : 11.4, t, { align: "center", stagger: 0.035, track: -6 });
    if (word === "Shine.") {
      const gl = sp(t, 10.95, S_UI) * (1 - io(prog(t, 11.3, 11.45)));
      if (gl > 0) { ctx.save(); ctx.globalAlpha = clamp(gl); ctx.strokeStyle = WHITE; ctx.lineWidth = 8; ctx.lineCap = "round";
        const gx = CX + 300, gy = CY - 70, L = 46 * gl;
        ctx.beginPath(); ctx.moveTo(gx - L, gy); ctx.lineTo(gx + L, gy); ctx.moveTo(gx, gy - L); ctx.lineTo(gx, gy + L); ctx.stroke(); ctx.restore(); }
    }
  });

  // ===== 6. LOCKUP (11.45 - 15) =====
  if (t >= 11.45) {
    const m = sp(t, 11.55, S_TYPE), build = io(prog(t, 11.55, 12.05)), slide = sp(t, 12.0, S_BOX);
    const mx = lerp(CX, CX - 290, slide), my = CY - 120;
    ctx.save(); ctx.translate(mx, my); ctx.scale(m, m); mark(ctx, 0, 0, 150, build); ctx.restore();
    revealText("Glitter", mx + 175, my + 58, 170, 700, WHITE, 12.05, null, t, { stagger: 0.04 });
    revealText("Our app is now live!", CX, CY + 170, 76, 600, LOGO_LIME, 12.45, null, t, { align: "center", stagger: 0.02 });
    const st = sp(t, 12.9, S_UI);
    [["App Store", -1], ["Google Play", 1]].forEach(([s, side]) => {
      const w = 330, x = CX + side * 175 - w / 2, y = CY + 270 + (1 - st) * 60;
      ctx.save(); ctx.globalAlpha = clamp(st);
      rrect(ctx, x, y, w, 100, 50, "rgba(246,248,244,0.1)");
      ctx.strokeStyle = "rgba(246,248,244,0.35)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x, y, w, 100, 50); ctx.stroke();
      text(ctx, s, x + w / 2, y + 63, 40, 600, WHITE, "center");
      ctx.restore();
    });
  }
  return true;
};
function drawPhoneFrame(t, rotY, rotZ, pcy, st) {
  st.rotY = rotY;
  drawPhoneFlat(t, st);
  drawPhone3D(pcy, rotY, rotZ);
}

// ---------- boot + preview HUD ----------
(async () => {
  await document.fonts.load(F(700, 100)); await document.fonts.load(F(400, 100)); await document.fonts.load(F(800, 100)); await document.fonts.ready;
  await logoIcon.decode(); await logoMark.decode();
  const q = new URLSearchParams(location.search);
  await window.seek(parseFloat(q.get("t") || "0"));
  window.ready = true;
  if (!q.has("preview")) return;
  document.body.classList.add("preview");
  let cur = 0, playing = true, last = null; const hud = document.getElementById("hud");
  const loop = (ts) => {
    if (playing) { if (last != null) cur += (ts - last) / 1000; if (cur > T) cur = 0; }
    last = ts; window.seek(cur); hud.textContent = `${cur.toFixed(2)} s  [space] play  [←/→] frame  [R] replay`;
    requestAnimationFrame(loop);
  };
  addEventListener("keydown", e => {
    if (e.code === "Space") { playing = !playing; e.preventDefault(); }
    if (e.code === "ArrowRight") { playing = false; cur = Math.min(T, cur + 1 / 30); }
    if (e.code === "ArrowLeft") { playing = false; cur = Math.max(0, cur - 1 / 30); }
    if (e.code === "KeyR") { cur = 0; playing = true; }
  });
  requestAnimationFrame(loop);
})();
</script>
